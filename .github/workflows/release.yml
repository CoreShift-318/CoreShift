name: release

# Builds distributables and publishes them as a GitHub Release on this repo.
# Triggers on version tags (v0.1.0) or manually.
# No external artifacts repo, no extra secrets: uses the built-in GITHUB_TOKEN.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Publish (linux-x64, self-contained)
        run: dotnet publish src/CoreShift.Game/CoreShift.Game.csproj -c Release -r linux-x64 --self-contained true -o dist/linux-x64
      - name: Package (.tar.gz, .deb, .rpm)
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          VERSION="$VERSION" ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/CoreShift.Game/CoreShift.Game.csproj -c Release -r win-x64 --self-contained true -o dist/win-x64
      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '0.1.0' }
          wix build packaging/coreshift.wxs -o "dist/CoreShift-$version-win-x64.msi"
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '0.1.0' }
          Compress-Archive -Path dist/win-x64/* -DestinationPath "dist/CoreShift-$version-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish (${{ matrix.rid }}, self-contained)
        run: dotnet publish src/CoreShift.Game/CoreShift.Game.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o dist/${{ matrix.rid }}
      - name: Package .app / .dmg / .zip
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.1.0"; fi
          chmod +x packaging/make-macos-app.sh
          packaging/make-macos-app.sh ${{ matrix.rid }} "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release on this repo (gh cli)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.1.0"; fi
          tag="v$version"
          files=$(find artifacts -type f)
          echo "Publishing $tag on this repo:"
          echo "$files"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "CoreShift $tag" \
              --notes "Automated build of CoreShift $tag."
          fi
          # shellcheck disable=SC2086
          gh release upload "$tag" --clobber $files
